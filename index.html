<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="시간대별 혼잡도를 고려한 서울 지하철 경로 추천 시스템"
    />
    <title>서울 지하철 혼잡도 경로 추천</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #07111f;
        color: #f5f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(30, 144, 255, 0.2), transparent 34%),
          radial-gradient(circle at 80% 10%, rgba(28, 205, 148, 0.14), transparent 30%),
          #07111f;
      }

      main {
        width: min(760px, calc(100% - 40px));
        padding: 48px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(10, 24, 42, 0.78);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border-radius: 999px;
        background: rgba(28, 205, 148, 0.12);
        color: #6ce7b7;
        font-size: 14px;
        font-weight: 700;
      }

      .badge::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1ccd94;
        content: "";
        box-shadow: 0 0 14px #1ccd94;
      }

      h1 {
        margin: 26px 0 16px;
        font-size: clamp(34px, 7vw, 60px);
        line-height: 1.12;
        letter-spacing: -0.045em;
      }

      h1 span {
        color: #4ea4ff;
      }

      p {
        margin: 0;
        color: #aebed1;
        font-size: 18px;
        line-height: 1.75;
      }

      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 34px;
      }

      .feature {
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.035);
        color: #dce8f5;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
      }

      footer {
        margin-top: 34px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #6f839b;
        font-size: 13px;
      }

      @media (max-width: 620px) {
        main {
          padding: 32px 24px;
        }

        .features {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">프로젝트 개발 중</div>
      <h1>서울 지하철<br /><span>혼잡도 경로 추천</span></h1>
      <p>
        시간대별 혼잡도와 이동시간, 환승시간을 반영해 더 나은 지하철 경로를
        추천하는 객체지향 프로그래밍 팀 프로젝트입니다.
      </p>

      <section class="features" aria-label="주요 기능">
        <div class="feature">최단시간 경로</div>
        <div class="feature">최소혼잡 경로</div>
        <div class="feature">최소환승 경로</div>
      </section>

      <footer>Object-Oriented Programming Team 8</footer>
    </main>
  </body>
</html>
